  - >-
    Library adoption follows the 2026-10-26 voxel ruling
    (research/2026-10-26-voxel-library-survey.md) — well-known libraries preferred
    (godot_voxel / native HLOD); adopting one is a named charter decision.
  - >-
    2TB repo rules apply — explicit-path commits only, never push, delete nothing
    unasked.
