<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="820" viewBox="0 0 1024 820">
  <!-- gag-manga single-panel skeleton (P0: docs/records/2026-09-12-gag-manga-pipeline.md).
       Placeholders are filled server-side by jobs/manga-draft.py; all text is
       XML-escaped there. Image generation is optional (imagegen local leg). -->
  <rect width="1024" height="820" fill="#f7f2e7"/>
  <rect x="14" y="14" width="996" height="560" fill="#ffffff" stroke="#141414" stroke-width="7"/>
{{IMAGE}}
  <!-- caption box -->
  <rect x="36" y="36" width="540" height="92" rx="4" fill="#ffffff" stroke="#141414" stroke-width="5"/>
  <text font-family="monospace" font-size="22" font-weight="bold" fill="#141414">
    {{CAPTION}}
  </text>
  <!-- speech bubble + tail -->
  <ellipse cx="716" cy="428" rx="244" ry="98" fill="#ffffff" stroke="#141414" stroke-width="5"/>
  <polygon points="636,516 596,586 706,520" fill="#ffffff" stroke="#141414" stroke-width="5"/>
  <text font-family="monospace" font-size="19" fill="#141414">
    {{DIALOGUE}}
  </text>
  <!-- SFX -->
  <text x="110" y="536" font-family="monospace" font-size="54" font-weight="bold"
        fill="#141414" transform="rotate(-12 110 536)">{{SFX}}</text>
  <!-- narrative strip (grounded text + source citation) -->
  <rect x="14" y="590" width="996" height="152" fill="#ffffff" stroke="#141414" stroke-width="5"/>
  <text font-family="monospace" font-size="17" fill="#141414">
    {{NARRATIVE}}
  </text>
  <!-- attribution footer -->
  <text x="14" y="776" font-family="monospace" font-size="16" fill="#141414">{{ATTRIB}}</text>
</svg>
