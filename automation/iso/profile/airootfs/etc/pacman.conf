# pacman.conf — baked into the airootfs so every installed target gets
# working repos. mkarchiso otherwise emits a serverless conf (Include
# mirrorlist stays stock-commented), which bit both the live env and the
# first installed target (2026-09-28). Direct Server lines, self-contained;
# CachyOS before core/extra per CachyOS convention; [omarchy] last.
[options]
HoldPkg = pacman glibc
Architecture = auto
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[cachyos]
Server = https://cdn.cachyos.org/repo/$arch/$repo

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[omarchy]
SigLevel = Required DatabaseOptional
Server = https://pkgs.omarchy.org/stable/$arch
