# hngh live medium — BIOS boot (syslinux). Single self-contained cfg:
# no releng PXE/whichsys dispatch in the scaffold.
UI menu.c32
MENU TITLE hngh live medium
DEFAULT arch
TIMEOUT 30

LABEL arch
MENU LABEL hngh live medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
