# pacman.conf — repos for the hngh live ISO. Read by mkarchiso on the BUILD
# host (pacstrap): Include paths resolve against the build host, so core/
# extra follow releng and reuse /etc/pacman.d/mirrorlist. CachyOS + Omarchy
# use direct Server URLs (self-contained). CachyOS repos come before
# core/extra per CachyOS convention so their packages win; [omarchy] last.
# Building requires an Arch/CachyOS host with archiso installed and the
# cachyos + omarchy keyrings already trusted (cachyos-keyring is installed
# into the image, but pacstrap needs the host to trust the repos first).
[options]
HoldPkg = pacman glibc
Architecture = auto
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[cachyos-v3]
Server = https://cdn.cachyos.org/repo/$arch/$repo

[cachyos]
Server = https://cdn.cachyos.org/repo/$arch/$repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[omarchy]
SigLevel = Required DatabaseOptional
Server = https://pkgs.omarchy.org/stable/$arch
