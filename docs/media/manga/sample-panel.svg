<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="820" viewBox="0 0 1024 820">
  <!-- gag-manga single-panel skeleton (P0: docs/records/2026-09-12-gag-manga-pipeline.md).
       Gekiga upgrade 2026-09-12 (operator critique + docs/research/2026-09-12-publication-review-01.md):
       Averia Gruesa Libre for dialogue + SFX, Iosevka for caption/narrative/footer
       (generic fallbacks keep the renderer safe on a fontless box); screentone
       pattern sky, feTurbulence ink-wash filter, hand-drawn scene sketch under the
       image slot (megastructure skyline + lone figure, so an imageless panel is
       never empty), double-line frame with seed-jittered tilt, per-seed SFX
       placement/scale, margin note + red seal so a panel always carries more than
       one bubble and one KRAK. Placeholders are filled server-side by
       jobs/manga-draft.py; all text is XML-escaped there. Image generation is
       optional (imagegen local leg). -->
  <defs>
    <pattern id="screentone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.3" fill="#141414"/>
    </pattern>
    <pattern id="screentone-dark" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.1" fill="#141414"/>
    </pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#141414" stroke-width="1.1"/>
    </pattern>
    <filter id="ink" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>
    <clipPath id="artz"><rect x="18" y="18" width="988" height="632"/></clipPath>
  </defs>
  <rect width="1024" height="820" fill="#f7f2e7"/>

  <!-- hand-drawn scene placeholder: sits UNDER <image x="18" y="18" width="988" height="632" href="../imagegen/manga-panel-20260912T185223Z.png" preserveAspectRatio="xMidYMid"/>; a generated panel covers it -->
  <g clip-path="url(#artz)" filter="url(#ink)">
    <rect x="18" y="18" width="988" height="300" fill="#ffffff"/>
    <rect x="18" y="18" width="988" height="300" fill="url(#screentone)" opacity="0.5"/>
    <rect x="40" y="270" width="120" height="380" fill="#141414"/>
    <rect x="40" y="270" width="120" height="380" fill="url(#hatch)" opacity="0.35"/>
    <rect x="250" y="200" width="95" height="450" fill="#141414"/>
    <rect x="250" y="200" width="95" height="450" fill="url(#hatch)" opacity="0.25"/>
    <rect x="700" y="240" width="150" height="410" fill="#141414"/>
    <rect x="700" y="240" width="150" height="410" fill="url(#hatch)" opacity="0.3"/>
    <rect x="905" y="330" width="90" height="320" fill="url(#screentone-dark)"/>
    <path d="M18 470 L120 468 L240 474 L360 470 L480 476 L610 471 L740 477 L870 472 L1006 475"
          fill="none" stroke="#141414" stroke-width="3"/>
    <path d="M18 520 L1006 524" fill="none" stroke="#141414" stroke-width="2" opacity="0.7"/>
    <path d="M18 250 Q 500 300 1006 240" fill="none" stroke="#141414" stroke-width="1.6" opacity="0.6"/>
    <path d="M18 285 Q 500 335 1006 275" fill="none" stroke="#141414" stroke-width="1.6" opacity="0.6"/>
    <g transform="translate(520 470)">
      <circle cx="0" cy="-52" r="13" fill="#141414"/>
      <path d="M-18 -40 L18 -40 L14 40 L-14 40 Z" fill="#141414"/>
      <path d="M-14 40 L-18 96 L-6 96 L-2 44 L2 44 L6 96 L18 96 L14 40 Z" fill="#141414"/>
    </g>
    <g stroke="#141414" stroke-width="1.6" opacity="0.55">
      <line x1="60" y1="600" x2="96" y2="640"/>
      <line x1="150" y1="590" x2="190" y2="636"/>
      <line x1="330" y1="600" x2="368" y2="642"/>
      <line x1="450" y1="592" x2="492" y2="638"/>
      <line x1="620" y1="602" x2="656" y2="640"/>
      <line x1="800" y1="594" x2="840" y2="638"/>
      <line x1="940" y1="604" x2="972" y2="640"/>
    </g>
  </g>

  <!-- art frame: double line, -0.500 deg jitter for hand-drawn feel -->
  <g transform="rotate(-0.500 512 334)">
    <rect x="14" y="14" width="996" height="640" fill="none" stroke="#141414" stroke-width="7"/>
    <rect x="24" y="24" width="976" height="620" fill="none" stroke="#141414" stroke-width="2.5"/>
  </g>
<image x="18" y="18" width="988" height="632" href="../imagegen/manga-panel-20260912T185223Z.png" preserveAspectRatio="xMidYMid"/>
  <!-- caption box -->
  <rect x="36" y="36" width="540" height="92" rx="3" fill="#ffffff" stroke="#141414" stroke-width="4"/>
  <text font-family="Iosevka, monospace" font-size="22" font-weight="bold" fill="#141414">
    <tspan x="50" y="68">MEANWHILE, IN WORLD NEWS...</tspan>
  </text>
  <!-- speech bubble + tail (third-point anchor: cx=2/3 of 1024, cy=1/3 of art zone) -->
  <ellipse cx="682" cy="227" rx="244" ry="98" fill="#ffffff" stroke="#141414" stroke-width="4"/>
  <polygon points="602,315 562,385 672,319" fill="#ffffff" stroke="#141414" stroke-width="4"/>
  <text font-family="Averia Gruesa Libre, Comic Sans MS, cursive" font-size="19" fill="#141414">
    <tspan x="548" y="202">I told you the paperwork was</tspan><tspan x="548" y="226">load-bearing!</tspan>
  </text>
  <!-- SFX: x/y/size/rotation filled per seed; white halo keeps it readable
       over the dark towers (both copies get the same attrs) -->
  <text font-family="Averia Gruesa Libre, Comic Sans MS, cursive" font-weight="bold"
        fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"
        x="146" y="557" font-size="61" transform="rotate(-16 146 557)">BZZT</text>
  <text font-family="Averia Gruesa Libre, Comic Sans MS, cursive" font-weight="bold"
        fill="#141414" x="146" y="557" font-size="61" transform="rotate(-16 146 557)">BZZT</text>
  <!-- margin note (dim Iosevka) + red seal: every panel carries 3+ elements
       beside the bubble (publication-review-01 finding) -->
  <text x="640" y="612" font-family="Iosevka, monospace" font-size="15" font-style="italic"
        fill="#5a5548" transform="rotate(-1.5 640 612)">note: it was, in fact, not fine.</text>
  <g transform="rotate(-6 948 72)" opacity="0.85">
    <rect x="914" y="57" width="68" height="30" fill="#ffffff" fill-opacity="0.7" stroke="#a3282d" stroke-width="3"/>
    <text x="921" y="78" font-family="Iosevka, monospace" font-size="13" fill="#a3282d">APPROVED</text>
  </g>
  <!-- narrative strip (grounded text + source citation) -->
  <rect x="14" y="668" width="996" height="112" fill="#ffffff" stroke="#141414" stroke-width="4"/>
  <text font-family="Iosevka, monospace" font-size="17" fill="#141414">
    <tspan x="28" y="700">Grounded event: Google no longer</tspan><tspan x="28" y="722">provides direct URLs in search results</tspan><tspan x="28" y="744">(severity NOTABLE). Source cited</tspan><tspan x="28" y="766">below.</tspan>
  </text>
  <!-- attribution footer -->
  <!-- ponytail: single-line footer at 12px fits ~135 chars; per-word wrap if longer URLs appear -->
  <text x="14" y="804" font-family="Iosevka, monospace" font-size="12" fill="#141414">[DRAMATIZATION - procedural gag, not a real quote] -- GDELT 2.0 export, https://www.autom.dev/blog/google-search-goto-links</text>
</svg>
