name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TERM: xterm-256color

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # the loop-history-guard test walks git history from a restatement
      # commit; a depth-1 clone cannot resolve it (exit 128)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install --yes sbcl
      - name: Test local kernel
        run: make test
  test-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # suite needs bash + python3 (preinstalled) + git/curl/jq (preinstalled)
      # + sqlite3 (not preinstalled; used by the model-leg tests)
      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install --yes sqlite3
      - name: Test automation tier
        run: cd automation && make test
