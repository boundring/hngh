name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint parens (all Lisp source)
        run: python3 scripts/lint-parens.py $(find src tests -name '*.lisp')

      - name: Lint dependency guardrails (Wave B)
        run: python3 scripts/lint-deps.py