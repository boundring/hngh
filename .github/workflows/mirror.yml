name: Mirror to Codeberg

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror to Codeberg
        run: |
          git remote add codeberg https://codeberg.org/hngh/hngh.git || true
          git push --force codeberg main
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/id_ed25519_codeberg -o StrictHostKeyChecking=no"
        if: ${{ secrets.CODEBERG_SSH_KEY != '' }}